name: Build and Release Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # 当推送新的版本标签时触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build browser runtime
        run: |
          npm ci
          npm run build:pi-ai
          git diff --exit-code -- src/vendor/pi-ai

      - name: Verify release sources
        run: |
          version="$(node -p "require('./manifest.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
          npm test
          find src "v/${version}/src" -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Create Chrome ZIP file
        id: package
        run: |
          release_file="cerebr-${GITHUB_REF_NAME}-chrome.zip"
          zip -r "${release_file}" . \
            -x "*.git*" \
            -x "*.github*" \
            -x ".codex/*" \
            -x "*.DS_Store" \
            -x "README*" \
            -x "AGENTS.md" \
            -x "docs/*" \
            -x "scripts/*" \
            -x "tests/*" \
            -x "tmp/*" \
            -x "v/*" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "vercel.json" \
            -x "CNAME"
          echo "release_file=${release_file}" >> "${GITHUB_OUTPUT}"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.package.outputs.release_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
